project_id = "gutech-internal-lms"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
# No public sign-up anywhere: users are created by an admin with the service-role key.
enable_signup = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = false
# Reset links expire after one hour.
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "25MiB"
